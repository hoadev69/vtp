<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Nhập Liệu</title>
    <link rel="stylesheet" href="./home.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Nhập Dữ Liệu</h2>
        <form id="formSelect" action="ketqua.html" method="GET">
            <div class="form-group">
                <label for="huyen0">Thành phố/Huyện:</label>
                <select id="huyen0" name="chonHuyen" onchange="updateSecondSelect()" required></select>
            </div>
        
            <div class="form-group">
                <label for="xa0">Xã:</label>
                <select id="xa0" name="chonXa" required></select>
            </div>
        
            <div class="form-group">
                <label for="thon0">Thôn:</label>
                <select id="thon0" name="chonThon" ></select>
            </div>
        
            <div class="form-group">
                <label for="barcodeInput">Nhập số mã vạch:</label>
                <input type="text" id="barcodeInput" name="barcode" placeholder="Nhập mã vạch" required>
            </div>
        
            <div id="dynamicFields"></div>
        
            <button type="submit">Gửi</button>
        </form>
        <p id="formError" class="form-error" role="alert" hidden></p>
        

        <script>
            let geography = [];

            function updateSecondSelect() {
                const selectedDistrict = geography.find(item => item.name === document.getElementById('huyen0').value);
                const communeSelect = document.getElementById('xa0');
                communeSelect.replaceChildren();

                (selectedDistrict?.communes || []).forEach(commune => {
                    const option = document.createElement('option');
                    option.value = commune.name;
                    option.textContent = commune.name;
                    communeSelect.appendChild(option);
                });
                updateThonSelect();
            }

            function updateThonSelect() {
                const communeName = document.getElementById('xa0').value;
                const villageSelect = document.getElementById('thon0');
                const villagesByCommune = {
                    'Gia Phú': ['Thôn Nậm Hẻn', 'Thôn Đông Căm', 'Thôn Hùng Thắng', 'Thôn Phú Xuân', 'Thôn Bến Phà', 'Thôn Chính Tiến', 'Thôn Soi Cờ', 'Thôn Soi Giá', 'Thôn Đồng Lục', 'Bản Bay', 'Thôn Xuân Tư'],
                    'Thống Nhất': ['Thôn Hòa Lạc', 'Thôn Thái Bo', 'Thôn Giao Ngay', 'Thôn Giao Tiến', 'Thôn Tiến Cường', 'Thôn Tân Tiến', 'Thôn Tiến Thắng', 'Thôn Muồng', 'Thôn Chang', 'Phú Hùng', 'Thôn Mường Bát', 'Bản Cam', 'Thôn Khe Luộc', 'Thôn Kắp kẹ', 'Thôn An Thành'],
                    'Xuân Giao': ['Thôn Chành', 'Thôn Hùng Xuân', 'Thôn Tiến Lợi', 'Thôn Giao Bình', 'Thôn Mường', 'Thôn Phẻo', 'Thôn Vàng', 'Thôn Tiến Lợi', 'Thôn Hợp Giao'],
                    'Phú Nhuận': ['Phú Thịnh 1', 'Phú Thịnh 2', 'Phú Thịnh 3', 'Phú An 1', 'Phú An 2', 'Tân Lập', 'Phú Sơn', 'Làng Đền', 'Khe Bá', 'Phú Hải 2', 'Phú Hải 3', 'Nhuần 2', 'Nhuần 3'],
                };

                villageSelect.replaceChildren();
                (villagesByCommune[communeName] || []).forEach(village => {
                    const option = document.createElement('option');
                    option.value = village;
                    option.textContent = village;
                    villageSelect.appendChild(option);
                });
            }

            const form = document.getElementById('formSelect');
            const formError = document.getElementById('formError');
            const submitButton = form.querySelector('button[type="submit"]');
            let formFields = [];
            submitButton.disabled = true;
            document.getElementById('xa0').addEventListener('change', updateThonSelect);

            Promise.all([fetch('/api/geography'), fetch('/api/form-fields')]).then(async responses => {
                if (responses.some(response => !response.ok)) {
                    throw new Error('Không thể tải cấu hình biểu mẫu. Vui lòng tải lại trang.');
                }
                return Promise.all(responses.map(response => response.json()));
            }).then(([items, fields]) => {
                geography = items;
                const districtSelect = document.getElementById('huyen0');
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.name;
                    option.textContent = `${item.kind === 'city' ? 'TP.' : 'H.'} ${item.name.replace(/^(TP\.|H\.)\s*/, '')}`;
                    districtSelect.appendChild(option);
                });
                districtSelect.value = items.find(item => item.kind === 'city')?.name || items[0]?.name || '';
                updateSecondSelect();
                formFields = fields;
                const dynamicFields = document.getElementById('dynamicFields');
                fields.forEach(field => {
                    const input = document.createElement('input');
                    input.id = field.key;
                    input.name = field.key;
                    input.type = field.inputType;
                    input.value = field.defaultValue;

                    if (field.visible) {
                        const group = document.createElement('div');
                        group.className = 'form-group';
                        const label = document.createElement('label');
                        label.htmlFor = field.key;
                        label.textContent = `${field.label}:`;
                        group.append(label, input);
                        dynamicFields.append(group);
                    } else {
                        input.type = 'hidden';
                        dynamicFields.append(input);
                    }
                });
                submitButton.disabled = items.length === 0;
            }).catch(error => {
                formError.textContent = error.message;
                formError.hidden = false;
            });

            form.addEventListener('submit', async event => {
                event.preventDefault();
                formError.hidden = true;
                const values = new FormData(form);

                try {
                    const response = await fetch('/api/history', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            barcode: values.get('barcode'),
                            chonHuyen: values.get('chonHuyen'),
                            chonXa: values.get('chonXa'),
                            chonThon: values.get('chonThon'),
                            fields: Object.fromEntries(formFields.map(field => [field.key, values.get(field.key) || ''])),
                        }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Không thể lưu lịch sử tạo mã.');
                    Object.entries(result.fields || {}).forEach(([key, value]) => values.set(key, value));
                    window.location.assign(`/ketqua.html?${new URLSearchParams(values)}`);
                } catch (error) {
                    formError.textContent = error.message;
                    formError.hidden = false;
                }
            });

        </script>
</body>
</html>
