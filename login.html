<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị</title>
    <link rel="stylesheet" href="/home.css">
    <link rel="stylesheet" href="/login.css">
    <script src="/login.js" defer></script>
</head>
<body class="vtp-ui">
    <main class="login-panel ui-surface ui-surface--elevated">
        <p class="eyebrow">VTP · KHU VỰC QUẢN TRỊ</p>
        <h1>Đăng nhập</h1>
        <form id="loginForm">
            <label class="ui-label" for="username">Tên đăng nhập</label>
            <input id="username" name="username" class="ui-input" autocomplete="username" required>
            <label class="ui-label" for="password">Mật khẩu</label>
            <input id="password" name="password" class="ui-input" type="password" autocomplete="current-password" required>
            <button class="ui-button ui-button--primary" type="submit">Đăng nhập</button>
            <p id="loginError" class="ui-alert ui-alert--danger" role="alert" hidden></p>
        </form>
    </main>
</body>
</html>
